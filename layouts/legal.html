{{/* 법적 고지 페이지(개인정보처리방침 등) — 컬럼 상세와 같은 히어로·본문 스타일을 쓴다. */}}
{{ define "main" }}
<section id="top" style="background-image: linear-gradient(180deg, #A7E6E4 0%, #C2EEED 24%, #DCF4F4 50%, #F1FAFA 74%, #FFFFFF 92%); border-bottom: 1px solid #EDE6DA; padding: 44px 0 56px;">
  <div style="max-width: 1200px; margin: 0 auto; padding: 0 24px;">
    <div style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: #4A4A44; margin-bottom: 28px;">
      <a href="/" style="color: #4A4A44;" class="nav-link">홈</a><span>›</span>
      <span style="color: #001E2B; font-weight: 600;">{{ .Title }}</span>
    </div>
    <h1 style="font-size: 44px; font-weight: 500; line-height: 1.3; letter-spacing: -1px; margin: 0 0 16px; text-wrap: balance;">{{ .Title }}</h1>
    {{ with .Params.summary }}<p style="font-size: 18px; line-height: 1.75; color: #4A4A44; margin: 0; max-width: 640px; text-wrap: pretty">{{ . }}</p>{{ end }}
  </div>
</section>

<section style="background: #FFFFFF; padding: 56px 0 80px;">
  <div style="max-width: 1200px; margin: 0 auto; padding: 0 24px;">
    <article class="prose-column" style="max-width: 760px;">
      {{ .Content }}
    </article>
    <div style="max-width: 760px; margin-top: 48px; padding-top: 24px; border-top: 1px solid #EDE6DA;">
      <a href="/" style="font-size: 15px; font-weight: 600;">← 홈으로 돌아가기</a>
    </div>
  </div>
</section>
{{ end }}
