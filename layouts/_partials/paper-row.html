{{/* 학술 논문 한 줄 — 항목마다 카드를 만들지 않고 papers-list 한 칸 안에 나열한다.
     인자: 논문 항목 하나. 앞의 점은 컬럼 본문 목록과 같은 6px 민트 점을 쓴다. */}}
<div class="paper-row">
  <span style="flex: 0 0 6px; width: 6px; height: 6px; border-radius: 9999px; background: #22ABAF;"></span>
  <div style="min-width: 0;">
    <div style="font-size: 15px; font-weight: 500; line-height: 1.6; color: #3A3A34; text-wrap: pretty;">{{ .title }}</div>
    <div style="font-size: 13px; line-height: 1.6; color: #6F6B61; margin-top: 4px;">{{ .journal }}{{ with .citation }} {{ . }}{{ end }}</div>
    {{ with .url }}
    <a href="{{ . }}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 14px; font-weight: 600;">논문 상세보기<span style="font-size: 12px;">→</span></a>
    {{ end }}
  </div>
</div>
