{{ define "main" }}
{{ $notices := partial "notices.html" . }}
{{ $total := len $notices }}

<section id="top" style="background-image: linear-gradient(180deg, #A7E6E4 0%, #C2EEED 24%, #DCF4F4 50%, #F1FAFA 74%, #FFFFFF 92%); border-bottom: 1px solid #EDE6DA; padding: 44px 0 56px;">
  <div style="max-width: 1200px; margin: 0 auto; padding: 0 24px;">
    <div style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: #4A4A44; margin-bottom: 28px;">
      <a href="/" style="color: #4A4A44;" class="nav-link">홈</a><span>›</span>
      <span style="color: #001E2B; font-weight: 600;">공지사항</span>
    </div>
    <div style="display: inline-flex; align-items: center; font-size: 13px; font-weight: 600; color: #0F7A7E; background: #FFFFFF; border: 1px solid #C0FAE6; padding: 7px 14px; border-radius: 9999px; margin-bottom: 16px;">Notice</div>
    <h1 style="font-size: 44px; font-weight: 500; line-height: 1.3; letter-spacing: -1px; margin: 0 0 16px;; text-wrap: balance">공지사항</h1>
    <p style="font-size: 18px; line-height: 1.75; color: #4A4A44; margin: 0; max-width: 640px;; text-wrap: pretty">진료 일정과 운영 안내를 이곳에 올립니다. 제목을 누르면 내용이 펼쳐집니다.</p>
  </div>
</section>

<section style="background: #FFFFFF; padding: 48px 0 88px;">
  <div style="max-width: 1200px; margin: 0 auto; padding: 0 24px;">
    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px;">
      <span style="margin-left: auto; align-self: center; font-size: 14px; color: #6B6960;">전체 {{ $total }}건</span>
    </div>
    {{ partial "notice-table.html" (dict "notices" $notices "start" $total) }}
    <div style="margin-top: 28px;"><a href="/" style="font-size: 15px; font-weight: 600;">← 홈으로 돌아가기</a></div>
  </div>
</section>
{{ end }}
