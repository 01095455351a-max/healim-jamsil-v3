# 새 글·고친 글의 주소를 검색엔진에 바로 알린다(IndexNow).
#
# 사이트맵만 두면 검색엔진이 다시 찾아올 때까지 며칠~몇 주가 걸린다.
# IndexNow 로 알리면 빙·네이버 등 참여 검색엔진이 그 주소를 먼저 수집한다.
# ChatGPT 검색은 빙 색인을 많이 쓰므로 AI 검색 노출(GEO)에도 직접 영향이 있다.
# 구글은 IndexNow 를 쓰지 않는다 — 구글은 지금처럼 사이트맵으로 수집한다.
#
# 언제 도는가
#   master 의 Cloudflare Pages 빌드가 성공으로 끝났을 때(= 사이트에 반영된 뒤).
#   CMS 에서 「발행」을 누르든, Claude 가 master 에 올리든 똑같이 돈다.
#   cms/... 초안 빌드에서는 돌지 않는다 — 미리보기 주소를 알리면 안 된다.
#
# 무엇을 알리는가
#   그 커밋에서 바뀐 content/ 파일의 주소. 컬럼이 바뀌면 /column/ 목록과 홈도.
#   data/·layouts/ 가 바뀌면 홈 한 쪽만. 지워진 글의 주소도 알린다(삭제 반영).
#
# 키(열쇠) — static/<키>.txt 파일이 사이트에 올라가 있어야 검색엔진이 받아 준다.
#   키를 바꾸려면 그 파일 이름·내용과 아래 KEY 를 함께 바꾼다.
#   실패해도 사이트에는 아무 영향이 없다(알림만 안 갈 뿐). 결과는 Actions 로그에 남는다.
#
# check_run 이벤트는 master 에 있는 이 파일로만 동작한다(cms-preview-link.yml 과 같다).

name: 검색엔진 알림(IndexNow)

on:
  check_run:
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event.check_run.name == 'Cloudflare Pages' &&
      github.event.check_run.conclusion == 'success' &&
      github.event.check_run.check_suite.head_branch == 'master'
    runs-on: ubuntu-latest
    env:
      HOST: healim-jamsil.com
      KEY: 4597c0876669460d88b34795da8cded1
      SHA: ${{ github.event.check_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.check_run.head_sha }}
          fetch-depth: 2
      - name: 바뀐 주소 모으기
        id: urls
        run: |
          python3 - <<'PY' > urls.txt
          import os, subprocess
          host = os.environ["HOST"]
          out = subprocess.run(["git", "diff", "--name-only", "HEAD^1", "HEAD"],
                               capture_output=True, text=True).stdout.split()
          urls = []
          def add(p):
              u = f"https://{host}{p}"
              if u not in urls:
                  urls.append(u)
          for f in out:
              if f.startswith("content/") and f.endswith(".md"):
                  rest = f[len("content/"):-3]
                  parts = rest.split("/")
                  if parts[0] in ("survey",):        # 검색에서 막아 둔 도구 페이지
                      continue
                  if parts[-1] == "_index":
                      add("/" + "/".join(parts[:-1]) + "/")
                  elif parts[0] == "notice":          # 공지는 목록에서만 펼친다
                      add("/notice/")
                  else:
                      add("/" + rest + "/")
                  if parts[0] == "column":
                      add("/column/"); add("/")
              elif f.startswith(("data/", "layouts/")):
                  add("/")
          print("\n".join(urls))
          PY
          cat urls.txt
          echo "count=$(grep -c . urls.txt || true)" >> "$GITHUB_OUTPUT"
      - name: IndexNow 로 보내기
        if: steps.urls.outputs.count != '0'
        run: |
          body=$(python3 -c "import json,os;print(json.dumps({'host':os.environ['HOST'],'key':os.environ['KEY'],'keyLocation':f\"https://{os.environ['HOST']}/{os.environ['KEY']}.txt\",'urlList':open('urls.txt').read().split()}))")
          # 한 곳에 보내면 참여 검색엔진끼리 공유하지만, 네이버에는 따로도 보낸다.
          for ep in https://api.indexnow.org/indexnow https://searchadvisor.naver.com/indexnow; do
            code=$(curl -s -o /tmp/res -w '%{http_code}' -X POST "$ep" \
              -H 'Content-Type: application/json; charset=utf-8' --data "$body" || echo 000)
            echo "$ep → HTTP $code $(head -c 200 /tmp/res)"
          done
          # 200·202 는 접수. 403 은 키 파일을 못 찾은 것(배포 직후면 다음 발행 때 정상).
          # 실패해도 작업을 실패로 표시하지 않는다 — 사이트와 무관한 알림이라서.
