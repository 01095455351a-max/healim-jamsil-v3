# 치료 방법 9가지. tier가 화면의 묶음을 정한다 —
#   core     중심이 되는 치료 (한약)
#   common   함께 진행하는 치료
#   optional 증상에 따라 활용하는 치료
# 원래 출처 — 출처: home-c/content/guide/treatments/*.md의 popup_intro/popup_applies_to/popup_steps
# (mockup index.html의 {{ t.name }}/{{ t.summary }} 팝업은 미해결 placeholder였으나,
#  home-c에 정확히 대응하는 실제 콘텐츠가 있어 이를 실제 정보로 사용함 — 창작 아님)
- slug: herbal-medicine
  tier: core
  name: "개인맞춤한약"
  summary: "증상과 체질, 현재 몸 상태에 맞춰 1:1로 처방되는 개인별 맞춤 한약 — 해아림한의원 잠실점 치료의 핵심 축입니다."
  applies_to:
    - "공황장애·불안장애의 항진된 신경계 안정"
    - "틱장애·ADHD의 두뇌 기능 균형 회복"
    - "자율신경실조증·다한증의 자율신경 조절"
    - "불면증의 심신 이완, 우울장애의 신체 에너지 회복"
  steps:
    - "초진 시 정밀 검사(자율신경 균형 검사, 뇌기능 평가)로 현재 상태 파악"
    - "원장 심층 진료를 통해 체질과 증상 유형 판별"
    - "개인별 맞춤탕약 처방 및 조제"
    - "2주 또는 4주 단위 재진으로 변화된 몸 상태에 맞춰 처방 조정"

- slug: acupuncture
  tier: common
  name: "침치료"
  summary: "증상과 몸 상태에 맞는 경혈을 자극해 통증과 신체 긴장을 덜고 기혈 순환을 돕는 기본 치료입니다."
  applies_to:
    - "목·어깨·허리·관절의 통증과 긴장"
    - "두통·어지럼·가슴 두근거림 등 신체 증상"
    - "소화불량·복부 불편감·수면 문제"
    - "불안·공황·스트레스로 인한 신체 긴장"
    - "자율신경 불균형과 관련된 다양한 증상"
  steps:
    - "원장 진료를 통해 주요 증상과 전신 상태 파악"
    - "머리·목·복부·등·팔다리 등 증상에 맞는 경혈 선정"
    - "필요에 따라 수승화강침·마음침 등 맞춤 침치료 시행"
    - "한약 및 다른 치료의 진행 경과에 맞춰 주기적으로 병행"

- slug: pharmacopuncture
  tier: common
  name: "약침치료"
  summary: "정제된 한약재 추출물을 경혈에 직접 주입하는 시술로, 침치료·한약 치료와 함께 진행합니다."
  applies_to:
    - "만성적인 근골격계 긴장·통증을 동반한 신경성 질환"
    - "자율신경실조증으로 인한 특정 부위의 순환 저하"
    - "두통·어지럼증과 동반된 목·어깨 긴장"
  steps:
    - "원장 진료를 통해 증상 부위와 정도 파악"
    - "필요 성분의 약침을 선정"
    - "해당 경혈·부위에 정밀 주입"
    - "한약·침치료 등 다른 치료와 병행하며 경과 관찰"

- slug: chuna
  tier: optional
  name: "추나요법"
  summary: "척추·관절과 주변 근육의 틀어짐을 한의사가 손으로 직접 다루는 치료입니다."
  detail: "약과 침이 몸의 기능을 다룬다면 추나는 뼈와 관절이 놓인 자리, 곧 몸의 구조를 다룹니다. 오래 굳어진 자세나 한쪽으로 기운 체형이 증상의 바탕에 깔려 있는 경우, 이 부분을 함께 살펴 치료 방향을 잡습니다. 2019년부터 건강보험 급여 항목에 포함되어 정해진 기준 안에서 보험이 적용되며, 구조적인 문제가 함께 있을 때는 한약·침 치료와 나란히 진행합니다."
  applies_to:
    - "경추 불균형과 관련된 신경성 두통·어지럼증"
    - "만성적인 목·어깨·허리 긴장"
    - "자세 불균형으로 인한 순환 저하"
  steps:
    - "체형·자세 및 척추 정렬 상태 확인"
    - "불균형이 있는 부위를 정밀하게 판별"
    - "손을 이용한 수기 교정 시행"
    - "필요 시 침·약침 치료와 병행"

- slug: cranial-sacral
  tier: optional
  name: "두개천골요법"
  summary: "가벼운 수기 자극을 활용해 긴장을 완화하고 두뇌신경의 안정을 돕기 위해 병행합니다."
  applies_to:
    - "자극에 예민한 소아의 틱장애·ADHD 보조 치료"
    - "불안·긴장이 심해 강한 자극이 부담스러운 경우"
    - "두통, 수면의 질 저하"
  steps:
    - "두개골·천골 주변의 긴장 상태를 가볍게 촉진으로 확인"
    - "매우 가벼운 압력으로 두개천골 리듬 조율"
    - "전신 이완 반응이 나타날 때까지 진행"
    - "한약 치료 등과 병행하여 신경계 안정을 돕습니다"

- slug: fcst
  tier: optional
  name: "FCST교정"
  summary: "턱관절과 안면부의 긴장, 자세와 움직임을 살펴 필요에 따라 활용하는 수기 치료입니다."
  applies_to:
    - "안면근육 긴장을 동반한 신경성 질환"
    - "두개골 불균형과 관련된 두통·어지럼증"
    - "턱관절 및 안면부 긴장"
  steps:
    - "안면·두개골 균형 상태 확인"
    - "불균형 부위를 손으로 정밀하게 교정"
    - "필요 시 침·추나요법과 병행"
    - "경과에 따라 주기적으로 재평가 및 조정"

- slug: brain-training
  tier: optional
  name: "두뇌훈련"
  summary: "주의력과 조절력, 감각 처리와 몸의 균형을 함께 연습하는 훈련 프로그램입니다."
  detail: "부설 두뇌심리연구소에서 진행합니다. 보고 듣고 움직이며 들어오는 감각 정보를 신경계가 정리하는 과정을 반복해 연습하는 방식으로, 주의를 유지하는 힘과 충동을 멈추는 힘, 몸의 균형을 잡는 힘을 함께 다룹니다. 아이부터 성인까지 나이와 상태에 맞춰 난이도를 달리해 진행합니다."
  applies_to:
    - "ADHD의 주의력·충동 조절"
    - "틱장애의 자기조절력 향상"
    - "불안·공황 환자의 예민함에 대한 제어력 강화"
    - "시험불안 등 특정 상황에서의 긴장 조절"
    - "감각 자극에 유난히 민감하거나 둔하게 반응하는 경우"
  steps:
    - "뇌기능 평가로 주의력·조절력과 감각 처리 상태 확인"
    - "개인별 취약 영역에 맞춘 훈련 프로그램 설계"
    - "정기적인 세션을 통해 반복 훈련"
    - "경과에 따라 훈련 난이도와 방향 조정"

- slug: counseling
  tier: common
  name: "전문의 심리상담"
  summary: "한방신경정신과 전문의와 함께 증상의 배경이 되는 생각과 상황을 짚어보는 심층 상담입니다."
  # detail은 선택 항목이다 — 적으면 팝업에서 요약 아래 문단으로 나오고,
  # 없으면 그 자리가 비지 않는다. 카드에는 나오지 않으므로 길어도 된다.
  detail: "심층 상담에서는 한의정신요법과 브레인스포팅, 마음챙김명상, 자율훈련법 등을 병행하여 증상 이면의 감정과 생각을 알아차리고 스스로 돌보는 법을 이해하고 연습할 수 있습니다."
  applies_to:
    - "공황장애·불안장애의 예기불안 관리"
    - "강박장애의 강박사고 패턴 이해"
    - "우울장애의 자기비하적 사고 정리"
    - "만성 스트레스, 번아웃 등 정서적 어려움 전반"
  steps:
    - "초진 시 증상과 배경 상황에 대한 심층 문진"
    - "생각과 행동의 패턴을 함께 짚어봅니다"
    - "1:1 맞춤 한약 치료와 병행 진행"
    - "재진마다 경과와 변화를 함께 점검"

- slug: aromatherapy
  tier: optional
  name: "향기치료"
  summary: "식물에서 얻은 정유의 향을 침치료와 함께 활용해 몸의 긴장을 누그러뜨립니다."
  detail: "코로 들어온 냄새 자극은 감정과 기억을 다루는 뇌 부위로 곧장 전달되는 경로를 지납니다. 향기치료는 이 경로를 이용해 진료와 치료를 받는 동안 긴장이 덜한 상태를 만드는 방법으로, 침치료를 받는 동안 함께 진행합니다."
  applies_to:
    - "공황장애·불안장애에서 급성 긴장감을 가라앉힐 때"
    - "불면증 환자의 취침 전 심신 이완"
    - "진료·검사 과정에서 느끼는 긴장을 줄이는 목적"
  steps:
    - "증상과 체질에 따라 이완·안정에 적합한 향료를 선택합니다"
    - "침구 치료나 상담 중 흡입 또는 도포 방식으로 병행합니다"
    - "반응을 보며 향의 종류와 사용 방식을 조정합니다"
