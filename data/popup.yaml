# 홈에 뜨는 안내 팝업. 이 파일 하나로 켜고 끈다.
#
# enabled: false 로 두면 통째로 나오지 않는다. 기간(start~end)이 지나도
# 저절로 사라지므로 내리는 것을 잊어도 된다 — 날짜는 빌드할 때 판정한다.
# 다만 Cloudflare는 푸시가 있을 때만 다시 빌드하므로, 기간이 끝난 뒤
# 아무 변경도 없으면 팝업이 하루 이틀 더 남을 수 있다. 확실히 내리려면
# enabled를 false로 바꿔 푸시한다.
#
# 의료광고 주의 — 효능을 단정하는 문구(피로 회복·면역력 등), 「선착순」·
# 「무료」 같은 조바심 표현, 다른 의료기관과 비교를 유도하는 문장은 넣지
# 않는다. 가격과 기간처럼 사실만 적는다.
enabled: true
start: 2026-09-11
end: 2026-09-30

label: "추석 이벤트"
title: "공진단 · 경옥고"
period_text: "9월 30일까지"

# 표의 줄. 늘리면 화면에 그대로 늘어난다.
#   group  소제목 (같은 값끼리 묶인다)
#   name   항목
#   was    (선택) 정가. 적으면 취소선으로 함께 보인다
#   price  실제 금액
groups:
  - name: "공진단"
    rows:
      - name: "5g 1환 · 사향 100mg"
        price: "60,000원"
      - name: "10환 단위 · 20% 할인"
        was: "600,000원"
        price: "480,000원"
  - name: "경옥고"
    rows:
      - name: "60스틱"
        was: "220,000원"
        price: "180,000원"
      - name: "1.2kg 단지"
        was: "300,000원"
        price: "250,000원"

note: "금액은 처방 내용과 복용 기간에 따라 달라질 수 있습니다."

