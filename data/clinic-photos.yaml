# 첫 화면 슬라이드의 사진 설명과 자르는 위치.
#
# 사진 자체는 assets/media/clinic/ 폴더를 그대로 읽는다 — 폴더에 넣으면
# 슬라이드에 붙고, 빼면 사라진다. 레이아웃은 손댈 필요가 없다.
# 순서는 파일 이름순이므로 앞에 번호를 붙인다(01-, 02-, ...).
#
# 여기 적지 않은 사진도 화면에는 나온다. 설명이 "해아림한의원 잠실점 원내
# 사진"이 되고 가운데를 자를 뿐이다. 아래는 그걸 사진마다 지정하는 자리다.
#
#   키      파일 이름에서 .jpg를 뗀 것
#   alt     화면에는 안 보이지만 화면낭독기가 읽고 검색엔진이 참고한다
#   focus   세로로 어디를 남길지(0 = 위, 50 = 가운데, 100 = 아래).
#           칸이 데스크톱에서 557×460이라 세로 사진은 위아래가 잘린다.
#
# 사진은 밝기를 맞춰 두었다(중앙값 150 기준). 손대기 전 원본은 커밋
# 5aae4bd·7526e13·d3cd043에 남아 있다 — 필요하면 거기서 꺼내 쓴다.

01-reception:
  alt: "해아림한의원 잠실점 접수 데스크"
02-signage:
  alt: "해아림한의원 잠실점 로비의 상호 사인과 부설 해아림 두뇌·심리연구소 표기"
  focus: 25
03-waiting-room:
  alt: "소파와 서가가 있는 대기 공간"
04-counseling-room:
  alt: "의자 두 개가 마주 놓인 상담실"
05-treatment-room:
  alt: "커튼으로 나뉜 치료실"
06-apothecary:
  alt: "한약장 위에 놓인 그림과 꽃"
  # 그림·꽃병·한약장 서랍 윗단이 함께 들어오는 자리. 더 내리면 그림이
  # 위로 붙고, 더 올리면 서랍이 잘려 한약장인 줄 알기 어려워진다.
  focus: 65
07-corridor:
  alt: "진료실로 이어지는 복도. 왼쪽 벽에 수료증이 걸려 있다"
  # 가운데가 가장 낫다 — 위로 올리면 천장 환기구가, 아래로 내리면
  # 바닥이 크게 들어온다. focus를 적지 않으면 가운데다.
