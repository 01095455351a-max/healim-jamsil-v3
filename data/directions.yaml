# 잠실·송파 및 인접지역 내원 안내 페이지의 본문.
# layouts/directions.html이 이 파일을 읽는다. 문구를 고칠 때 레이아웃은 손대지 않는다.
#
# 지역은 세 단계로 나눈다.
#   PRIMARY   잠실·송파 — 병원이 실제로 있는 곳
#   SECONDARY 강동·광진·성동·위례·하남 — 생활권으로 이어진 인접지역
#   EXTENDED  구리·남양주·강원 — 장거리에서 내원하는 경우
# 인접·광역 지역을 지점이나 소재지처럼 쓰지 않는다.
#
# 실제 이동시간은 출발지와 교통상황에 따라 달라지므로 분 단위로 적지 않는다.

areas:
  - rank: "PRIMARY"
    title: "잠실 · 송파"
    lead: "병원이 있는 곳입니다."
    items:
      - label: "지하철"
        text: "2호선 잠실새내역 4번 출구에서 도보 3분, 9호선 종합운동장역 9번 출구에서 도보 5분입니다. 두 노선 중 편하신 쪽을 이용하시면 됩니다."
      - label: "자가용"
        text: "서일빌딩 뒤편 주차장을 이용하실 수 있습니다. 올림픽로에서 진입합니다."
      - label: "찾아오실 때"
        text: "서일빌딩 3층입니다. 건물 입구에서 엘리베이터를 이용해 주세요."

  - rank: "SECONDARY"
    title: "강동 · 광진 · 성동"
    lead: "서울 동부에서 잠실로 이어지는 지역입니다."
    items:
      - label: "지하철"
        text: "2호선과 9호선이 지나는 구간에서는 환승 없이 잠실새내역 또는 종합운동장역까지 오실 수 있습니다. 출발역에 따라 경로가 달라지므로 길찾기로 확인해 주세요."
      - label: "자가용"
        text: "올림픽대로와 강변북로에서 잠실 방면으로 진입합니다. 출퇴근 시간에는 여유를 두고 출발해 주세요."

  - rank: "SECONDARY"
    title: "위례 · 하남"
    lead: "서울 동남권과 인접한 경기 지역입니다."
    items:
      - label: "대중교통"
        text: "잠실 방면 버스와 지하철을 이용하실 수 있습니다. 출발 위치에 따라 환승 여부가 달라지므로 길찾기로 확인해 주세요."
      - label: "자가용"
        text: "잠실 방면으로 진입한 뒤 서일빌딩 뒤편 주차장을 이용하시면 됩니다."

  - rank: "EXTENDED"
    title: "구리 · 남양주"
    lead: "경기 동북부에서 내원하시는 경우입니다."
    items:
      - label: "이동"
        text: "대중교통과 자가용 모두 이용하고 계십니다. 이동시간은 출발 위치와 교통상황에 따라 차이가 크므로 길찾기로 미리 확인해 주세요."
      - label: "예약할 때"
        text: "첫 방문은 검사와 진료에 시간이 걸립니다. 이동시간까지 함께 계산해 여유 있게 예약해 주세요."

  - rank: "EXTENDED"
    title: "강원 등 장거리에서 방문하시는 경우"
    lead: ""
    items:
      - label: "첫 방문"
        text: "구리·남양주를 비롯한 경기 동북부와 강원 지역에서 내원하시는 분들도 있습니다. 장거리에서 처음 방문하시는 경우 문진과 검사, 원장 진료까지 약 1시간 30분~2시간 정도 소요되므로 이동시간을 고려해 예약해 주세요."
      - label: "재진"
        text: "첫 진료 이후 재진 시에는 치료 내용을 포함해 보통 40분~1시간 정도 소요됩니다. 다만 실제 소요시간은 환자의 증상과 치료 내용에 따라 달라질 수 있습니다."

# 화면에 그대로 표시하는 FAQ. 구조화 데이터도 이 내용과 똑같이 나간다.
faq:
  - q: "하남이나 위례에서도 내원하기 편한가요?"
    a: "해아림한의원 잠실점은 잠실에 위치해 있어 위례·하남 등 서울 동남권과 인접 경기 지역에서도 방문하고 있습니다. 정확한 이동시간은 출발 위치와 교통상황에 따라 달라질 수 있으므로 지도 또는 길찾기를 함께 확인해 주세요."
  - q: "구리·남양주에서 처음 방문할 때 얼마나 시간을 잡아야 하나요?"
    a: "이동시간 외에 첫 진료에 약 1시간 30분~2시간 정도를 예상해 주세요. 소아청소년 진료는 약 2시간~2시간 30분 정도 걸립니다. 첫 방문에는 문진과 검사, 원장 진료와 상담이 포함됩니다."
  - q: "강원 지역에서 방문하는 경우에는 어떻게 예약하면 좋나요?"
    a: "장거리에서 방문하시는 경우 이동시간과 첫 진료시간을 고려해 여유 있게 예약해 주세요. 첫 진료는 약 1시간 30분~2시간 정도 소요됩니다."
  - q: "재진에는 시간이 얼마나 걸리나요?"
    a: "첫 진료 이후 재진 시에는 치료 내용을 포함해 보통 40분~1시간 정도 소요됩니다. 다만 실제 소요시간은 환자의 증상과 치료 내용에 따라 달라질 수 있습니다."
