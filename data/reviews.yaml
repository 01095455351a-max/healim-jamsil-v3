# 자필 후기 스캔의 분류표. 화면의 「질환별 보기」 단추가 이것을 읽는다.
#
# 여기에 적지 않은 파일도 화면에는 그대로 나온다 — 분류만 「전체」로 잡힌다.
# assets/media/reviews/ 에 파일을 넣으면 붙는 구조를 깨지 않기 위해서다.
#
# 분류 이름은 아래 여섯 가지만 쓴다. 새 이름을 만들면 단추가 하나 늘어난다.
#   공황·불안 · 불면증 · 자율신경실조증 · 우울장애 · ADHD · 틱장애
#
# dx 는 스캔 용지의 「병명」 칸에 환자가 직접 적은 말이다. 화면에는 나오지
# 않고, 분류가 맞는지 나중에 대조할 때 쓴다. 비어 있으면 용지가 비어 있던 것이다.

