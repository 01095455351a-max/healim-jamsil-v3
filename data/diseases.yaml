# 질환을 화면에 늘어놓는 차례.
#
# 지금은 컬럼 목록(/column/)의 「질환별 보기」 단추가 이것을 본다. 그대로 두면
# 글을 올린 차례대로 늘어서서 주요 질환이 뒤로 밀린다.
#
# 여기 없는 이름은 뒤에 붙는다 — 컬럼에 새 태그를 달아도 단추가 사라지지 않는다.
# 반대로 여기 적어 두었는데 그 태그를 쓴 글이 없으면 단추가 나오지 않는다.
#
# 자필 후기 슬라이더(layouts/reviews/list.html)는 아직 제 차례를 따로 갖고 있다.
# 거기는 「공황·불안」처럼 둘을 묶은 이름과 「야뇨증」을 써서 낱말이 다르다.
# 두 낱말을 맞추면 이 파일 하나로 합칠 수 있다.
order:
  - 공황장애
  - 틱장애
  - ADHD
  - 불안장애
  - 자율신경실조증
  - 불면증
  - 다한증
  - 강박장애
  - 우울장애
  - 신경성 질환

# 단추에만 짧게 보일 이름. 모바일(767px 이하)에서만 바뀌고 PC 는 긴 이름 그대로다.
# 거르는 값은 위 order 의 이름이라 글의 태그를 고칠 필요가 없다.
#
# 「자율신경실조증」 7자가 가운데에 있으면 360px 에서 칩이 네 줄로 접힌다.
# 이 한 줄 덕분에 글자 크기를 14px 그대로 두고도 세 줄에 들어간다.
short:
  자율신경실조증: "자율신경"
