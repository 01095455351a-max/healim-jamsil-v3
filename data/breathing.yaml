# 4-2-6 호흡 연습 (/breathing/). layouts/breathing.html 이 이 파일을 읽는다.
# 문구를 고치면 화면이 그대로 바뀐다 — 레이아웃과 static/js/breathing.js 는 손대지 않는다.
#
# phases 의 sec 을 고치면 함께 따라오는 것들
#   · 위쪽 눈썹글씨의 「4 · 2 · 6」
#   · 안내 화면 그래픽의 칸 너비(4fr 2fr 6fr)와 「한 번의 호흡에 12초」
#   · 연습 분량의 사이클 수(N = 분 × 60 ÷ 한 사이클)
# 따라오지 않는 것 — headline 의 「12초의 리듬」과 페이지 제목의 「4-2-6」은
# 글이라 손으로 고쳐야 한다.
#
# 의료광고 문구는 임의로 줄이거나 지우지 않는다(caution · disclaimer · done.note).

# ── 안내 화면 ──────────────────────────────────────────────
headline: ["숨을 고르는", "12초의 리듬"]
graphic_note: "내쉬는 숨이 가장 깁니다"
lead: "내쉬는 숨을 들이쉬는 숨보다 길게 하면 몸이 편안한 상태로 돌아옵니다. 불안하거나 가슴이 답답할 때, 잠들기 어려울 때 하루 2~3번 연습해 보세요."

# 자세 안내. 줄을 늘리면 카드가 그대로 늘어나고 번호는 저절로 매겨진다.
tips:
  - "등을 기대고 앉거나 누워, 한 손은 배 위에 올립니다."
  - "숫자를 세는 원의 움직임에 맞춰 배가 부풀고 꺼지도록 합니다."
  - "화면의 물결이 퍼질 때 들이쉬고, 잦아들 때 내쉽니다. 숫자만 따라가도 됩니다."
  - "숫자를 억지로 맞추지 마세요. 내쉬는 숨이 길다는 느낌이면 충분합니다."

# 연습 분량(분). 사이클 수는 한 사이클 길이로 나눠 저절로 나온다.
presets_label: "연습 분량"
presets: [1, 3, 5, 10]
presets_default: 3

start: "연습 시작"
caution: "어지럽거나 숨이 가빠지면 바로 멈추고 평소 호흡으로 돌아오세요. 임신 중이거나 호흡기·심장 질환이 있는 분은 진료 때 먼저 상담해 주세요."
disclaimer: "이 연습은 진료나 치료를 대신하지 않습니다. 스스로 호흡을 고르는 방법을 익히는 도구이며, 증상이 있으실 때는 진료를 받으시기 바랍니다."

# ── 연습 화면 ──────────────────────────────────────────────
# 순서대로 한 사이클이 된다. sec 은 각 단계의 초.
# ease 는 물결이 커지고 작아지는 결. 멈추기만 linear 로 둔다 — 크기가 그대로라
# 결이 보이지 않는데, 다른 값을 주면 멈춘 동안 원이 미세하게 흔들린다.
#
# key 는 글이 아니라 이름표다 — site.css 가 이 값으로 물결의 상태
# (.br-rings[data-state="in"])와 안내 그래픽의 막대 색을 고른다.
# in · hold · out 세 개를 그대로 둔다. 바꾸면 물결이 서고 색이 빠진다.
phases:
  - key: "in"
    sec: 4
    label: "들이쉬기"
    hint: "코로 천천히 배까지 채웁니다"
    ease: "cubic-bezier(.4, 0, .4, 1)"
  - key: "hold"
    sec: 2
    label: "멈추기"
    hint: "어깨를 내리고 잠시 멈춥니다"
    ease: "linear"
  - key: "out"
    sec: 6
    label: "내쉬기"
    hint: "입으로 가늘고 길게 내보냅니다"
    ease: "cubic-bezier(.4, 0, .4, 1)"

paused_label: "잠시 멈춤"
paused_hint: "준비되면 이어서 계속하세요"

bell_label: "종소리 안내"
bell_note: "단계가 바뀔 때 낮게 울리고, 갈수록 잦아듭니다"

stop: "그만하기"
pause: "잠시 멈추기"
resume: "이어서 하기"

# ── 완료 화면 ──────────────────────────────────────────────
done:
  headline: ["호흡 연습을", "마쳤어요"]
  all: "숨이 조금 느려졌는지 살펴보세요. 어깨와 턱의 힘도 함께 풀어줍니다."
  partial: "중간에 멈춘 것도 괜찮습니다. 편안한 만큼만 하세요."
  rows_way: "호흡 방식"
  rows_cycles: "완료한 호흡"
  rows_time: "연습 시간"
  note: "이 연습은 진료나 치료를 대신하지 않습니다. 연습 후에도 가슴 답답함이나 불안이 계속되면 다음 내원 때 알려주세요. 진료 방향을 함께 조정합니다."
  again: "한 번 더 하기"
  home: "처음으로"
