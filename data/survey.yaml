        stack: true
        options:
          - { t: "가볍고 개운하다", s: "발한 후 개운" }
          - { t: "나른하고 지친다", s: "발한 후 나른·지침" }
        short: "{}"
      - type: choice
        text: "나의 체력은 {}"
        stack: true
        options:
          - { t: "체력이 약하고 쉽게 피곤하다", s: "체력 약함·쉽게 피곤" }
          - { t: "평균 정도", s: "체력 평균" }
          - { t: "체력이 좋아서 피로를 잘 모른다", s: "체력 좋음" }
        short: "{}"

  - key: water
    name: 음수
    items:
      - type: number
        text: "하루 음수량(물+음료수+커피) 모두 합쳐서 대략 {}리터"
        short: "음수 {}L"
      - type: choice
        text: "{}을 좋아한다"
        options: [찬 물, 따뜻한 물]
        short: "{} 선호"
      - type: check
        text: "내가 생각하기에 비정상적인 갈증이 있다 (예를 들어 「왜 나는 이렇게 목이 자주 마르지?」 이런 느낌)"
