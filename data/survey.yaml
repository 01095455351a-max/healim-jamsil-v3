        short: "트림 잦음"
      - type: check
        text: "속쓰림이 자주 있다"
        short: "속쓰림"
      - type: check
        text: "신물이나 음식물이 자주 역류한다"
        short: "역류"
      - type: check
        text: "냄새에 민감하고 음식비위가 약하다"
