# 문진표 문항. layouts/survey.html 이 이 파일 하나만 읽는다.
#
# 원내 종이 문진표(한의학 십문)를 그대로 옮겼다. 순서도 종이와 같다 —
# 한열 · 땀 · 음수 · 기호 · 식욕소화 · 대변 · 소변 · 심흉 · 수면 · 부녀 ·
# 두면견항인후 · 전신 · 관절 · 감기, 그 앞에 주증상, 뒤에 서술 3문항.
#
# ── 문항 적는 법 ───────────────────────────────────────────────
# type      choice   문장 속 택1        text 의 {} 자리에 선택지가 들어간다
#           multi    문장 속 택다        같음
#           check    단독 체크           text 가 그대로 체크 문장이 된다
#           number   숫자 기입           {} 마다 숫자칸이 하나씩 생긴다
#           text     한 줄 서술
#           textarea 여러 줄 서술
#           symptoms 증상+기간 여러 줄   rows 로 줄 수를 정한다
#
# text      화면에 보이는 문장. {} 가 입력칸 자리다.
# options   choice·multi 의 선택지. 문자열로 적으면 화면과 요약이 같은 말이 되고,
#           요약에서 다른 말을 쓰려면 { t: 화면 문장, s: 요약 표기 } 로 적는다.
# short     요약(진료용 정리)에 쓸 표현. {} 에 답이 들어간다. 없으면 text 를 쓴다.
#           ★ 원장이 차트에서 쓰는 말로 고치는 자리다. 화면 문장은 그대로 둔 채
#             요약 표기만 바꿀 수 있다.
# note      고르면 열리는 서술칸의 안내 문구(원본의 「언제? (   )」)
# detail    체크하면 나오는 하위 택다. options 를 적는다(문자열 또는 { t:, s: }).
#           note 와 함께 쓰면 「자주 고르는 것은 단추로, 나머지는 서술로」가 된다
# follow    체크하면 나오는 하위 택1(원본의 「→ □… □…」)
# when      female  이면 성별을 「여성」으로 답한 경우에만 나온다.
#           묶음(groups)에 붙이면 그 묶음 전체가 나오고 만다(부녀 묶음).
# hint      문항 위에 회색으로 붙는 안내문(원본의 ☞ 와 예시)
# stack     true 면 선택지를 옆으로 늘어놓지 않고 세로로 쌓는다(문장이 긴 선택지)
#
# 요약에 넣지 않을 문항은 short 에 빈 문자열("")을 준다.
#
# ※ short 와 s 안에서는 앞뒤에 공백을 둔 「 · 」를 쓰지 않는다. 요약에서 짧은
#   항목들을 한 줄로 이을 때 쓰는 기호라, 표기 안에 있으면 두 항목처럼 읽힌다.
#   붙여 쓴 「·」(손·발)는 괜찮다. 나눌 일이 있으면 「/」나 괄호를 쓴다.
#
# ══ ★ 종이와 다르게 한 곳 — 원장 확인이 필요하다 ══════════════
#
# 1) 서로 반대되는 체크칸을 택1로 바꿨다. 종이에서는 □ 두세 개이지만 내용이
#    서로 배타적이어서, 그대로 두면 둘 다 체크된 답이 들어온다.
#      · 대변      「하루라도 못 보면 불편」 / 「별 신경 쓰지 않는다」
#      · 식욕소화  「자주 체한다」 / 「더부룩만」 / 「거의 없다」
#      · 수면      「수면 문제로 고민 안 함」 / 「걸핏하면 스트레스」
#      · 수면      「30분~1시간 내 잠든다」 / 「2-3시간 이상 뒤척인다」
#
# 2) 한 문장에 숫자칸과 택1이 함께 있던 것을 두 문항으로 나눴다.
#      · 기호  「술 1주일에 __번 (많이, 조금) 마신다」
#      · 부녀  「생리주기 __일 (규칙적, 불규칙적)」
#
# 3) 한 체크칸에 딸린 괄호 선택지를 별도 문항으로 뺐다.
#      · 소변          「평소 잘 붓는다 (부위 / 오전, 오후)」
#      · 두면견항인후  「비염이 있다 (증상 / 사계절·환절기)」
#
# 4) 「성관계 후 하복통이나 골반통이 있다」 문항을 뺐다(2026-09-03 원장 지시).
#
# ══════════════════════════════════════════════════════════════

result_note: "환자가 직접 작성한 내용입니다. 표시가 없는 항목은 「해당 없음」이 아니라 「표시하지 않음」입니다."

groups:
  - key: basic
    name: 기본
    intro: "성별에 따라 뒤에서 나오는 문항이 달라집니다."
    items:
      - type: choice
        role: sex           # 이 문항의 답이 when: female 을 켜고 끈다. 지우지 않는다.
        text: "성별 {}"
        options: [여성, 남성]
        short: "{}"
      - type: number
        text: "만 {}세"
        short: "{}세"
      - type: number
        text: "키 {}cm"
        short: "{}cm"
      - type: number
        text: "몸무게 {}kg"
        short: "{}kg"

  - key: chief
    name: 주증상
    items:
      - type: symptoms
        text: "가장 치료받고 싶은 증상과 앓은 기간을 대략 적어주세요."
        hint: "예) 두통, 3년 / 산후풍, 1년 6개월"
        rows: 3
      - type: text
        text: "현재 복용 중인 양약이나 건강식품"
        placeholder: "예) 졸피뎀 10mg 3개월, 오메가3"
        short: "복용 {}"
      - type: textarea
        text: "과거 혹은 현재 병이나 수술과 시기"
        hint: "예) 자궁내막증 복강경수술, 2013년 / 갑상선 기능저하증, 2010년 진단 / 고혈압 / 당뇨 / 결핵"
        short: "병력 {}"

  - key: hanyeol
    name: 한열
    intro: "문진표가 정확해야 치료가 잘 됩니다. 해당하는 항목에만 표시해 주세요. 헷갈리는 부분은 비워 두셔도 됩니다."
    subs:
      - name: 추위
        items:
          - type: choice
            text: "추위를 {} 탄다"
            options: [약간, 보통, 많이, 어마어마하게]
            short: "추위 {}"
          - type: multi
            text: "{}가 차다"
            options: [손, 발, 아랫배]
            short: "{} 냉"
          - type: check
            text: "겨울에 양말을 신고 잘 때가 많다"
            short: "겨울 양말"
          - type: check
            text: "날씨가 추우면 전기장판을 켜는 것을 좋아한다"
            short: "전기장판"
          - type: check
            text: "여름에도 선풍기나 에어컨이 싫다"
            short: "여름에도 선풍기·에어컨 싫음"
          - type: check
            text: "(겨울에는) 몸의 어느 한 부위가 얼음장처럼 차고 시리다"
            short: "국소 냉·시림"
          - type: check
            text: "평소 냉이 많다"
            short: "냉 많음"
            when: female
          - type: check
            text: "추우면 냉이 왈칵 쏟아지는 느낌이 든다"
            short: "한랭 시 냉 증가"
            when: female
          - type: multi
            text: "생리기간이 아닐 때도 {}"
            stack: true
            when: female
            options:
              - t: "아랫배가 뭉치거나 아플 때가 있다"
                s: "비생리기 하복통"
              - t: "아랫배에 핫팩을 자주 한다"
                s: "하복부 핫팩"
            short: "{}"
          - type: choice
            hint: "추위·더위를 크게 타지 않는 분이라면"
            text: "그래도 굳이 말하자면 {}를 좀 더 탄다"
            options: [추위, 더위]
            short: "굳이 말하면 {} 쪽"
      - name: 더위
        items:
          - type: choice
            text: "더위를 {} 탄다"
            options: [약간, 보통, 많이, 어마어마하게]
            short: "더위 {}"
          - type: check
            text: "손발이 따뜻한 편이다"
            short: "손발 따뜻"
          - type: check
            text: "(여름에는) 손발이 따뜻한 정도가 아니라 열이 나고 화끈거린다"
            short: "손발 열감·화끈거림"
          - type: check
            text: "따뜻한 잠자리보다는 차라리 서늘하게 자야 몸이 더 편하고 컨디션이 좋다"
            short: "서늘한 잠자리 선호"
          - type: check
            text: "봄가을에도 찬물샤워를 하는 것을 좋아한다"
            short: "봄가을 찬물샤워"
          - type: check
            text: "얼굴이 쉽게 붉어지거나(안면홍조), 상체로 열이 자주 달아오른다"
            short: "안면홍조·상열감"
            note: "언제?"

