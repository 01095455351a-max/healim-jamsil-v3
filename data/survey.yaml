      - type: choice
        text: "한 번 마실 때 {} 마신다"
        options: [많이, 조금]
        short: "1회 {}"
      - type: number
        text: "담배를 하루 {}갑 피운다"
        short: "흡연 {}갑/일"
      - type: multi
        text: "술을 조금만 마셔도 몸이 불편해진다 — {}"
        stack: true
        options:
          - { t: "얼굴·몸이 붉어진다", s: "안면홍조" }
          - { t: "가슴이 두근거린다", s: "심계" }
          - { t: "금방 취한다", s: "쉽게 취함" }
        short: "소량 음주 불편({})"
