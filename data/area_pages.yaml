# 질환별 지역 안내 페이지. content/tic-areas/_content.gotmpl 이 이 파일을 읽어 페이지를 만든다.
#
# 지역을 더하려면 areas 아래에 한 덩어리를 추가하면 된다 — 레이아웃은 손대지 않는다.
# 페이지는 /diseases/tic/<slug>/ 에 생기고, 틱장애 페이지 맨 아래
# 「내원 지역 안내」 줄에 이 파일의 순서대로 자동으로 붙는다.
# 상단 메뉴·질환 목록·홈에는 나오지 않고, sitemap 에는 실린다.
#
# 규칙(data/directions.yaml 과 같다)
#   - 병원은 송파구 한 곳이다. 지역을 지점이나 소재지처럼 쓰지 않는다.
#   - 이동시간을 분 단위로 적지 않는다(출발지·교통상황에 따라 다르다).
#   - 확인하지 않은 교통 정보는 넣지 않는다.
#
# 각 항목
#   slug          주소에 쓰는 영문 이름
#   name          지역 이름. 검색 제목·H1 은 「<name> 틱장애 치료 병원」이 된다
#   neighborhoods 소개 문단에 들어가는 동네 이름(없으면 빼도 된다)
#   description   검색 결과 설명문
#   access        「<name>에서 오시는 길」 구역의 줄들
tic:
  base: /diseases/tic          # 내용(요약·FAQ·컬럼)을 가져오는 페이지
  title: "틱장애 치료 병원"     # 지역 이름 뒤에 붙는다

  # 틱 유형별 안내 — 지역 페이지 모두에 같은 내용으로 나온다(지역마다 따로 쓰지 않는다).
  # 원장 검수 전 초안. 수치는 아래 references 의 자료에서만 가져온다 — 출처 없는 수치를 더하지 않는다.
  # 문단은 paragraphs 에 한 줄씩. [글자](/주소/) 형식의 링크를 쓸 수 있다.
  guides_heading: "틱의 종류에 따라 이렇게 다릅니다"
  guides:
    - id: child
      title: "어린이 틱장애"
      paragraphs:
        - "틱은 아동기에 흔하게 나타납니다. 13개 연구를 종합한 분석에서 아동의 약 3%가 1년 안에 사라지는 일시적 틱을 겪는 것으로 보고되었고, 국내 건강보험 진료 통계(2013년)에서도 틱장애로 진료받은 사람의 82.5%가 20세 미만이었습니다. 성별로는 남성이 여성보다 3배 이상 많았습니다."
        - "처음에는 눈 깜빡임, 코 찡긋거림, 헛기침처럼 단순한 동작 하나로 시작하는 경우가 많습니다. 미국 정신의학회 진단 기준(DSM-5)은 증상이 1년이 되지 않으면 「잠정적 틱장애」, 한 가지 종류(근육틱 또는 음성틱)가 1년 넘게 이어지면 「지속성 틱장애」로 나눕니다."
        - "뚜렛장애 아동을 성인이 될 때까지 추적한 연구에서 증상이 가장 심했던 나이는 평균 10.6세였고, 85%가 청소년기를 지나며 증상이 줄었다고 보고했습니다. 다만 같은 시기에 학교생활과 또래 관계가 시작되므로, 증상이 아이를 위축시키고 있는지 함께 살펴야 합니다. 집에서는 증상을 지적하기보다 수면과 스마트폰 사용 시간을 먼저 정돈해 주시는 것이 좋습니다."
    - id: adult
      title: "성인 틱장애"
      paragraphs:
        - "틱장애가 어린이만의 문제는 아닙니다. 같은 국내 통계에서 20대가 진료인원의 8.7%를 차지했고, 어릴 때 시작된 틱이 성인까지 이어지거나 한동안 잠잠하다가 다시 나타나기도 합니다."
        - "성인이 되어 처음 틱이 나타난 22명을 살펴본 연구에서는 9명이 어린 시절 일시적인 틱을 겪은 적이 있었고, 새로 생긴 13명 가운데 6명은 감염·외상·약물 같은 다른 원인과 관련이 있었습니다. 그래서 성인이 되어 틱이 새로 생겼다면 다른 원인이 없는지 먼저 확인합니다. 진단 기준상 18세 이후 시작된 틱은 「달리 명시된 틱장애」로 분류합니다."
        - "성인은 직장과 대인관계에서 증상을 의식해 참는 시간이 길어지는 경우가 많습니다. 증상의 빈도뿐 아니라 수면, 피로, 긴장 수준을 함께 살펴 진료 방향을 정합니다."
    - id: vocal
      title: "음성틱"
      paragraphs:
        - "음성틱은 소리로 나타나는 틱입니다. 헛기침, 코 킁킁거림, 「음음」·「꺽꺽」 같은 단순한 소리가 대부분이고, 단어나 남의 말을 따라 하거나 자기 말을 되풀이하는 복합 음성틱도 있습니다."
        - "코 킁킁거림과 헛기침은 비염이나 감기와 헷갈리기 쉽습니다. 이비인후과 진료에서 코와 목에 이상이 없다고 하는데 소리가 계속되거나, 긴장하거나 피곤할 때 심해지고 잠들면 사라진다면 음성틱을 생각해 볼 수 있습니다."
        - "욕설을 하는 틱(외설증)을 걱정하시는 부모님이 많습니다. 7개국 뚜렛장애 환자 597명을 조사한 연구에서 외설증은 남성의 19.3%, 여성의 14.6%에서 나타나, 뚜렛장애에서도 소수에 해당했습니다."
    - id: tourette
      title: "뚜렛장애"
      paragraphs:
        - "뚜렛장애는 여러 가지 근육틱과 한 가지 이상의 음성틱이 함께 있고, 틱이 시작된 뒤 1년 넘게 이어지며, 18세 이전에 시작된 경우를 말합니다(DSM-5). 근육틱과 음성틱이 꼭 같은 시기에 나타날 필요는 없습니다. 아동의 약 0.77%로 보고되어, 틱 증상을 보이는 아이 가운데 일부에 해당합니다."
        - "뚜렛장애 환자 1,374명을 조사한 연구에서 85.7%가 평생 한 가지 이상의 다른 정신건강 문제를 함께 겪었고, 72.1%가 강박장애나 ADHD를 동반했습니다. 그래서 틱만이 아니라 [주의력 문제](/diseases/adhd/)와 [강박 증상](/diseases/ocd/)이 함께 있는지도 진료에서 확인합니다."

  # 위 안내의 참고자료. 화면 맨 아래에 이 순서대로 나온다.
  references:
    - "American Psychiatric Association. Diagnostic and Statistical Manual of Mental Disorders, 5th ed. (DSM-5). 2013."
    - "건강보험심사평가원. 틱장애 진료 현황(2009~2013년 건강보험 진료비 지급자료). 2014년 8월 보도자료."
    - "Knight T, Steeves T, Day L, et al. Prevalence of tic disorders: a systematic review and meta-analysis. Pediatr Neurol. 2012;47(2):77-90."
    - "Bloch MH, Peterson BS, Scahill L, et al. Adulthood outcome of tic and obsessive-compulsive symptom severity in children with Tourette syndrome. Arch Pediatr Adolesc Med. 2006;160(1):65-69."
    - "Chouinard S, Ford B. Adult onset tic disorders. J Neurol Neurosurg Psychiatry. 2000;68(6):738-743."
    - "Freeman RD, Zinner SH, Müller-Vahl KR, et al. Coprolalia among patients with Tourette syndrome. Dev Med Child Neurol. 2009;51(3):218-227."
    - "Hirschtritt ME, Lee PC, Pauls DL, et al. Lifetime prevalence, age of risk, and genetic relationships of comorbid psychiatric disorders in Tourette syndrome. JAMA Psychiatry. 2015;72(4):325-333."
  areas:
    - slug: gangdong
      name: "강동구"
      neighborhoods: "천호·길동·암사·명일·고덕·둔촌"
      description: "강동구에서 틱장애 진료를 알아보시는 분께 — 해아림한의원 잠실점은 잠실새내역 도보 3분 거리에서 어린이 틱장애, 성인 틱장애, 음성틱, 뚜렛장애를 진료합니다. 강동구에서 오시는 길과 첫 진료 안내를 확인하세요."
      access:
        - label: "지하철 5·8호선"
          text: "8호선 암사·천호·강동구청역에서 잠실역까지 온 뒤 2호선으로 갈아타고 한 정거장인 잠실새내역 4번 출구로 나오시면 도보 3분입니다. 5호선 길동·굽은다리·명일·고덕 쪽에서는 천호역에서 8호선으로 갈아타시면 됩니다."
        - label: "지하철 9호선"
          text: "둔촌동 일대에서는 9호선 중앙보훈병원역에서 환승 없이 종합운동장역까지 오실 수 있습니다. 9번 출구에서 도보 5분입니다."
        - label: "자가용"
          text: "천호대로나 올림픽대로를 거쳐 잠실 방면 올림픽로로 진입합니다. 서일빌딩 뒤편 무료 주차장을 이용하실 수 있습니다."
