# 첫 내원 안내 페이지의 본문. layouts/first-visit.html이 이 파일을 읽는다.
# 문구를 고칠 때 레이아웃을 건드릴 필요가 없다. 항목을 늘리면 화면에 그대로 늘어난다.

# 첫 진료·재진 소요시간. 페이지 여러 곳에서 이 값을 쓴다 — 여기만 고치면 된다.
duration:
  first: "약 1시간 30분~2시간"
  revisit: "약 40분~1시간"

# 진료 흐름 5단계. 단계별 분 단위 시간은 두지 않는다 —
# 검사와 상담 내용에 따라 달라지므로 전체 소요시간만 안내한다.
steps:
  - title: "예약 및 접수"
    text: "예약 내용을 확인하고 처음 방문하신 분께 필요한 기본 안내를 드립니다."
    note: "현재 복용 중인 약이나 최근 검사 결과가 있다면 접수 시 함께 알려주세요."
  - title: "문진과 현재 상태 확인"
    text: "현재 가장 불편한 증상이 언제 시작되었고 어떻게 변화해 왔는지 확인합니다. 증상과 함께 수면, 식사와 소화, 대소변, 피로도, 스트레스, 생활습관 등을 폭넓게 살펴봅니다."
    note: "현재 복용 중인 약, 과거 치료 경험, 다른 의료기관의 검사 결과도 진료에 중요한 참고가 됩니다."
  - title: "검사 및 상태 평가"
    text: "현재 증상을 보다 객관적으로 이해하고 진료에 필요한 정보를 보완하기 위해 여러 검사를 진행합니다. 심박변이도 검사, 뇌기능검사, 주의집중력검사, 간이정신심리검사와 다양한 심리척도 등을 활용해 신체적·신경생리적·심리적 상태를 함께 살펴봅니다."
    note: "주요 검사 구성은 일정한 기준에 따라 진행하며, 증상과 연령, 진료 목적에 따라 필요한 항목을 선택하거나 일부 평가를 추가할 수 있습니다."
  - title: "원장 진료와 상담"
    text: "문진과 검사 결과를 함께 살펴보며 현재 증상에 영향을 주는 신체 상태와 생활 요인을 종합적으로 평가합니다. 환자분이 이해하기 쉬운 말로 현재 상태와 우선적으로 살펴볼 부분을 설명드립니다."
    note: "검사 결과만으로 진단하거나 치료 방향을 결정하지 않으며, 증상이 시작된 과정과 현재의 불편감, 병력, 생활습관 등을 원장의 진료 내용과 함께 종합적으로 고려합니다."
  - title: "치료 계획 안내와 첫 치료"
    text: "진료 내용을 바탕으로 치료가 필요한 경우 현재 상태에서 우선적으로 필요한 치료와 향후 치료 방향을 설명드립니다. 환자분이 치료 방향을 충분히 이해한 뒤 동의한 계획에 따라 한약 처방이나 침 치료 등을 시작합니다."
    note: "다음 내원 시점과 치료 과정에서 관찰하면 좋은 변화, 생활에서 주의하면 좋은 부분도 함께 안내드립니다."

# 질환군에 따라 진료에서 함께 살피는 부분. 4단계 아래에 나온다.
step4_focus:
  - "공황·불안·강박·우울 등 정서적인 어려움이 큰 경우에는 생각과 감정, 스트레스와 생활 속 반복되는 패턴도 필요한 범위에서 함께 살펴봅니다."
  - "틱·ADHD·자율신경 증상 등에서는 증상의 변화 양상과 집중력, 수면, 생활환경 및 신체상태를 함께 확인합니다."

# 검사 안내 카드. abbr는 영문 약어 — 없으면 비워 둔다.
exams:
  - name: "심박변이도 검사"
    abbr: "HRV"
    text: "심장 박동 사이의 미세한 변화를 분석하여 자율신경계의 긴장과 회복 상태를 살펴보는 검사입니다."
    note: "두근거림, 긴장, 피로, 수면 문제, 어지럼과 같이 자율신경 반응과 함께 나타날 수 있는 증상을 이해하는 참고자료로 활용합니다."
  - name: "뇌기능검사"
    abbr: ""
    text: "뇌의 전기적 활동과 기능적 특성을 살펴보아 현재의 각성도, 긴장도, 집중 및 안정 상태를 이해하는 데 참고합니다."
    note: "집중력 문제, 수면장애, 불안, 틱 등 다양한 증상을 평가할 때 다른 검사와 진료 내용을 함께 해석하는 자료로 활용합니다."
  - name: "주의집중력검사"
    abbr: "CAT"
    text: "일정 시간 동안 주의를 유지하고 필요한 자극에 반응하는 능력, 충동 조절과 반응 특성 등을 살펴봅니다."
    note: "집중력 저하, 산만함, ADHD가 의심되는 경우뿐 아니라 학습이나 일상생활에서 집중의 어려움을 호소하는 경우 상태를 이해하는 데 참고합니다."
  - name: "간이정신심리검사"
    abbr: ""
    text: "현재 경험하고 있는 불안, 우울, 긴장, 신체화 증상 등 전반적인 정신심리 상태를 구조적으로 살펴봅니다."
    note: "환자가 말로 설명하기 어려운 부분을 파악하고 상담과 진료에서 보다 구체적으로 확인할 부분을 찾는 데 활용합니다."
  - name: "증상별 심리척도"
    abbr: ""
    text: "공황, 불안, 우울, 강박, 수면, 스트레스 등 현재 가장 불편한 증상과 관련된 정도를 구체적으로 살펴보기 위해 필요한 심리척도를 활용합니다."
    note: "증상의 심한 정도와 변화 과정을 확인하고 치료 전후의 상태를 비교하는 참고자료로 사용할 수 있습니다."

# 준비해 오시면 좋은 것.
prepare:
  - title: "현재 복용하고 있는 약과 영양제"
    text: "약 봉투, 처방전 또는 휴대전화로 촬영한 사진도 괜찮습니다."
  - title: "최근 다른 병원에서 시행한 검사 결과"
    text: "혈액검사, 심전도, 영상검사 등 현재 증상과 관련된 자료가 있다면 가져와 주세요."
  - title: "증상의 시작과 변화"
    text: "언제 처음 시작되었고 어떤 상황에서 심해지거나 덜해지는지 간단히 생각해 오시면 좋습니다."
  - title: "최근 수면 패턴"
    text: "최근 1~2주간 잠드는 시간, 자주 깨는지 여부, 기상 시간을 기억해 오시면 도움이 됩니다."
  - title: "소아청소년 진료 시 보호자 관찰 내용"
    text: "가정뿐 아니라 학교나 학원에서 증상이 어떻게 나타나는지 알고 계시면 함께 말씀해 주세요."
  - title: "과거 치료와 복용약"
    text: "과거에 복용했던 정신건강의학과 약이나 한약, 치료 경험이 있다면 가능한 범위에서 알려주세요."

# 미리 알아두실 점.
notices:
  - "예약제로 운영되므로 방문 전 전화 또는 네이버 예약으로 시간을 정해 주세요."
  - "첫 진료는 문진과 여러 검사, 원장 진료와 상담까지 포함되어 약 1시간 30분~2시간 정도 소요됩니다. 충분한 시간을 두고 예약해 주세요."
  - "첫 진료 이후 재진 시에는 치료 내용을 포함해 보통 40분~1시간 정도 소요됩니다. 다만 실제 소요시간은 환자의 증상과 치료 내용에 따라 달라질 수 있습니다."
  - "미성년자는 보호자와 함께 오셔야 상담이 가능합니다."
  - "심박변이도 검사나 뇌기능검사 등 검사 결과에 영향을 줄 수 있으므로 검사 당일에는 커피, 에너지음료 등 카페인 섭취를 피해 주세요. 예약 시 별도 안내가 있는 경우 안내사항을 따라 주세요."
  - "일정 변경은 하루 전까지 알려주시면 다른 분께 시간을 안내할 수 있습니다."
