# 학술 논문 — 홈 "출간 도서와 논문" 섹션에 카드로 표시된다.
#
# 각 항목의 필드와 화면상 위치
#   title    (필수) 논문 제목        → 카드 가운데 큰 글씨
#   journal  (필수) 학회지명          → 카드 위쪽 회색 글씨
#   year     (선택) 발표 연도        → 학회지명 옆에 "· 2024" 형태로 붙는다
#   authors  (선택) 저자 표기        → 카드 아래 작은 글씨
#                                      비워두면 "해아림한의원 원장단"으로 표시
#   url      (선택) 원문 주소        → 넣으면 카드 전체가 링크가 되고 ↗ 표시가 붙는다
#                                      없으면 클릭되지 않는 카드로 표시
#   sample   (선택) true 이면 "예시" 배지가 붙는다.
#                   실제 정보로 교체한 뒤에는 이 줄을 지운다.
#
# 항목을 지우고 목록을 비우면(빈 파일) 학술 논문 영역 전체가 화면에서 사라진다.
# 개수 제한은 없다 — 필요한 만큼 추가하면 카드가 늘어난다.
#
# ── 작성 예시 (아래 3건은 실제 논문이 아닌 자리표시자다) ──────────────

- title: "틱장애 아동의 한방 치료 임상 연구"
  journal: "대한한방신경정신과학회지"
  sample: true

- title: "공황장애 환자의 자율신경 균형 변화 분석"
  journal: "대한한방신경정신과학회지"
  sample: true

- title: "소아 ADHD의 한약 치료 경과 관찰"
  journal: "한방소아과학회지"
  sample: true

