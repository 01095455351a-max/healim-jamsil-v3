research:
  heading: "연구·학술활동"
  intro:
    - "석선희 원장은 동국대학교 한의과대학 한방신경정신과에서 공황장애, 불면, 우울, 화병 및 다양한 신체 증상에 대한 한의학적 치료와 임상 연구에 참여해 왔습니다."
    - "특히 한방치료와 함께 인지행동치료, 마음챙김명상 등 상담·심리치료적 접근을 병행한 임상 연구를 통해 마음과 몸의 증상을 함께 바라보는 한방신경정신과 치료에 대해 연구해 왔습니다."
  papers:
    - title: "무력감과 불안정한 혈압을 호소하는 공황장애 환자에게 한방치료 및 인지행동치료를 병행하여 호전된 1例"
