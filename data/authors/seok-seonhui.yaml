# research: 연구·학술활동.
#   heading/intro  원장 소개 페이지에 실리는 연구 이력 소개.
#   papers         논문 목록. 원장 소개 페이지가 아니라 홈 "출간 도서와 논문" 섹션에
#                  전체 원장의 것을 모아 표시한다.
