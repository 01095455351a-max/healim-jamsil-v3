bio: >-
  불안과 공황, 불면은 단순한 마음의 나약함이 아닌 뇌신경계와 자율신경의 신체적 불균형에서 시작됩니다.
  뇌와 신체의 균형을 회복시키는 1:1 맞춤 청정 한약 치료를 중심으로, 심층 상담치료를 병행하여
  치료가 끝난 이후의 일상이 평온할 수 있도록 돕습니다.
