#   순서           석선희 원장이 제1저자인 논문을 먼저 두고, 나머지를 뒤에 둔다.
#                  화면에는 이 파일에 적힌 순서 그대로 표시된다.
research:
  heading: "연구·학술활동"
  intro:
    - "석선희 원장은 동국대학교 한의과대학 한방신경정신과에서 공황장애, 불면, 우울, 화병 및 다양한 신체 증상에 대한 한의학적 치료와 임상 연구에 참여해 왔습니다."
    - "특히 한방치료와 함께 인지행동치료, 마음챙김명상 등 상담·심리치료적 접근을 병행한 임상 연구를 통해 마음과 몸의 증상을 함께 바라보는 한방신경정신과 치료에 대해 연구해 왔습니다."
  papers:
    - title: "무력감과 불안정한 혈압을 호소하는 공황장애 환자에게 한방치료 및 인지행동치료를 병행하여 호전된 1例"
      journal: "동의신경정신과학회지"
      citation: "2007;18(3):193-207"
      authors: "석선희, 김근우, 구병수"
      tags: ["공황장애", "인지행동치료", "한방치료"]

    - title: "신경정신과 약물을 복용해 온 우울증 환자의 불면증에 三黃瀉心湯을 병행 투여하여 호전된 1例"
      journal: "동의신경정신과학회지"
      citation: "2006;17(3):117-129"
      authors: "석선희, 김근우, 구병수, 김주호"
      tags: ["불면증", "우울증", "한약치료"]

    - title: "상복부 통증을 奔豚으로 진단하고 良枳湯을 투여하여 호전된 1례"
      journal: "동의신경정신과학회지"
      citation: "2008;19(2):265-278"
      authors: "석선희, 박세환, 김근우, 구병수"
      tags: ["신체증상", "스트레스", "한방치료"]

    - title: "광장공포증을 동반한 공황장애 환자의 1례 보고 - 발병초기부터 관찰한 내용을 중심으로 -"
      journal: "동의신경정신과학회지"
      citation: "2008;19(2):251-264"
      authors: "김지훈, 석선희, 구병수, 김근우"
      tags: ["공황장애", "광장공포증", "임상증례"]

    - title: "不眠과 身體症狀을 호소하는 화병 환자에게 韓醫學的 治療와 마음챙김명상을 병행하여 호전된 1례"
      journal: "동의신경정신과학회지"
      citation: "2008;19(3):231-244"
      authors: "박세환, 석선희, 김근우, 구병수"
      tags: ["화병", "불면", "마음챙김"]

    - title: "환각 및 지남력 저하에 대한 약물치료 중 발생한 섬망 환자 1例 증례보고"
      journal: "동의신경정신과학회지"
      citation: "2006;17(2):227-236"
      authors: "김주호, 김근우, 구병수, 석선희, 최은영"
      tags: ["섬망", "임상증례", "한방신경정신과"]

