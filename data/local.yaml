# 지역별 내원 안내. content/local/_content.gotmpl 이 이 파일을 읽어
# areas 한 블록당 페이지 하나(/local/<slug>/)를 만든다.
# 지역을 더할 때 레이아웃은 손대지 않는다 — 여기에 블록을 하나 더 쓰면 된다.
#
# 병원은 잠실에 있다. 이 지역들을 지점이나 소재지처럼 쓰지 않는다.
# 제목을 「위례 한의원」으로 적으면 위례에 있는 것처럼 읽힌다 —
# 「위례에서 가는」 형태를 쓴다.
#
# 이동시간은 출발지와 교통상황에 따라 달라지므로 분 단위로 적지 않는다
# (data/directions.yaml 과 같은 규칙이다).
#
# diseases_first 에 적은 질환이 앞에 오고, 나머지 질환은 content/diseases/ 에서
# 자동으로 뒤에 붙는다. 질환 페이지를 새로 만들어도 여기를 고칠 일이 없다.
#
# 주차장 안내 문구는 data/clinic.yaml 의 parking_note 한 곳에 있다.

areas:
  - slug: wirye
    name: "위례"
    date: 2026-11-22
    title: "위례에서 가는 잠실 한방신경정신과"
    title_seo: "위례에서 가는 잠실 한의원"
    cta: "위례에서 내원을 생각하고 계시다면"
    description: "해아림한의원 잠실점은 서울 송파구 잠실에 있습니다. 위례에서는 자가용으로 내원하시는 분이 많으며 서일빌딩 뒤편 무료 주차장을 이용하실 수 있습니다."
    lead: "해아림한의원 잠실점은 서울 송파구 잠실에 있는 한방신경정신과 한의원입니다. 위례에서 내원하시는 분들이 있어 오시는 방법을 따로 정리했습니다."
    diseases_first: ["anxiety-panic", "tic", "dysautonomia"]
    items:
      - label: "자가용"
        text: "위례에서는 자가용으로 오시는 분이 많습니다. 잠실 방면으로 진입하신 뒤 서일빌딩 뒤편 무료 주차장을 이용하시면 됩니다."
      - label: "찾아오실 때"
        text: "1층에 국민은행이 있는 서일빌딩입니다. 건물 입구에서 엘리베이터를 타고 3층으로 올라오세요."
      - label: "대중교통"
        text: "잠실 방면 버스와 지하철로도 오실 수 있습니다. 출발 위치에 따라 환승 여부가 달라지므로 길찾기로 확인해 주세요."

  - slug: munjeong
    name: "문정"
    date: 2026-11-22
    title: "문정에서 가는 잠실 한방신경정신과"
    title_seo: "문정에서 가는 잠실 한의원"
    cta: "문정에서 내원을 생각하고 계시다면"
    description: "해아림한의원 잠실점은 서울 송파구 잠실에 있습니다. 문정에서는 8호선 문정역에서 잠실역 환승으로, 또는 자가용으로 내원하십니다."
    lead: "해아림한의원 잠실점은 서울 송파구 잠실에 있는 한방신경정신과 한의원입니다. 같은 송파구 안이라 문정에서 내원하시는 분들이 있습니다."
    diseases_first: ["anxiety-panic", "tic", "dysautonomia"]
    items:
      - label: "지하철"
        text: "8호선 문정역에서 잠실역까지 오신 뒤 2호선으로 갈아타 잠실새내역에서 내리시면 됩니다. 4번 출구에서 도보 3분입니다. 9호선 종합운동장역을 이용하시는 경우 9번 출구에서 도보 5분입니다."
      - label: "자가용"
        text: "잠실 방면으로 진입하신 뒤 서일빌딩 뒤편 무료 주차장을 이용하시면 됩니다."
      - label: "찾아오실 때"
        text: "1층에 국민은행이 있는 서일빌딩입니다. 건물 입구에서 엘리베이터를 타고 3층으로 올라오세요."
