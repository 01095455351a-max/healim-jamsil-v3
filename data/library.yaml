# 게시판의 자료실. layouts/board.html 이 이 파일을 읽는다.
# 줄을 늘리면 화면에 그대로 늘어난다 — 레이아웃은 손대지 않는다.
#
# name     자료 이름
# summary  한두 줄 설명. 환자가 읽는 글이다
# url      내부 페이지(/survey/)나 파일(/files/....pdf) 어느 쪽도 된다
# action   누르는 글자. 없으면 「보기」
# badge    왼쪽 위 작은 딱지. 문진 · 안내 · 서식 처럼 짧게
# note     밑에 회색으로 붙는 단서. 없으면 나오지 않는다
# caution  꼭 알려야 하는 조건. note 보다 눈에 띄게 나온다. 없으면 나오지 않는다
# external true 면 새 창으로 열고 ↗ 를 붙인다(외부 사이트일 때만)
#
# 순서는 이 파일에 적힌 대로다. 자리를 바꾸려면 블록을 옮긴다.
# 자료를 잠시 내리려면 그 블록을 지우거나 앞에 # 을 붙인다.

- name: "전신 문진표"
  badge: "문진"
  summary: "진료 전에 몸 상태를 미리 여쭙는 문진표입니다. 주증상과 수면·소화·대소변·한열, 성격과 감정까지 살펴봅니다."
  url: "/survey/"
  action: "작성하기"
  note: "20분쯤 걸리며 중간에 닫으셔도 이어서 쓰실 수 있습니다. 적으신 내용은 사용하시는 기기에만 저장되고 어디로도 전송되지 않습니다."
  # 문진표 페이지에 나오는 전체 문장은 data/survey.yaml 의 send_condition 에 있다.
  caution: "본원에서 문진표 작성을 요청드린 경우에 한해 카카오톡 채널로 보내 주시면 확인해 드립니다."

- name: "첫 내원 안내"
  badge: "안내"
  summary: "처음 오시는 분을 위한 진료 흐름과 검사 안내입니다. 준비해 오시면 좋은 것도 함께 적어 두었습니다."
  url: "/first-visit/"
  action: "보기"
