baseURL: https://healim-jamsil.com/
locale: ko-KR
title: 해아림한의원 잠실점

enableRobotsTXT: true

# 태그·분류 목록 페이지는 만들지 않는다.
# 목록 레이아웃이 없어 HTML은 안 나오는데 sitemap에는 45개가 실려
# 검색엔진이 전부 404를 만나고 있었다.
# 글의 tags 값 자체는 그대로 쓴다 — 컬럼 필터와 칩은 .Params.tags를 읽는다.
disableKinds: ["taxonomy", "term"]

params:
  # 검토 기간에만 true. 검색엔진 수집을 막고 robots.txt로도 차단한다.
  # 2026-08-29 정식 공개하며 false로 바꿨다 — noindex 메타가 사라지고
  # robots.txt가 sitemap을 안내하는 내용으로 바뀐다.
  noindex: false
  # 홈의 <title>. 다른 페이지는 "글 제목 | 사이트 제목" 형태를 쓴다.
  # 검색 결과에서 어디에 있는 무슨 병원인지가 먼저 보이도록 지역·진료분야를 넣는다.
  title_home: "잠실·송파 한방신경정신과 한의원 | 해아림한의원 잠실점"
  # 검색엔진 사이트 소유 확인 코드. 값이 있을 때만 메타 태그가 나간다.
  # 네이버 서치어드바이저 > 사이트 관리 > 소유 확인에서 받은 content 값이다.
  # 확인이 끝난 뒤에도 지우면 소유가 풀리므로 그대로 둔다.
  # ── 방문자 분석 ───────────────────────────────────────────
  # 값을 채우면 _partials/analytics.html 이 스크립트를 내보낸다.
  # 비워 두면 아무것도 나가지 않는다. 검토 모드(noindex: true)에서도
  # 나가지 않는다 — 공개 전 접속이 통계에 섞이지 않게.
  #
  # 켜기 전에 /privacy/ 의 자동 수집 항목·국외 이전을 함께 고친다.
  ga4_id: "G-3FS31TW99C"              # G-XXXXXXXXXX
  naver_analytics_id: ""  # 영숫자 10자리
  naver_verification: "630c930bcc229e95149216760a65680ce35d7464"
  # 구글 서치 콘솔은 DNS TXT로 확인하므로 여기에 적을 것이 없다.
  google_verification: ""

  # 모든 페이지의 기본 meta description. 글에 description이 있으면 그쪽이 우선.
  description: "서울 송파구 잠실새내역 도보 3분. 공황·불안·강박·우울·불면과 틱·ADHD·자율신경실조증·다한증을 두 전담 원장이 나누어 진료합니다. 진료시간과 첫 내원 안내를 확인하실 수 있습니다."

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

# ── llms.txt ────────────────────────────────────────────────
# ChatGPT·Perplexity·Claude 같은 생성 AI 에게 「이 사이트에서 무엇을
# 인용하면 되는가」를 알려주는 파일이다. robots.txt 와 같은 자리
# (/llms.txt)에 평문으로 나간다.
#
# 내용은 layouts/index.llms.txt 가 사이트에서 직접 만든다 — 질환·컬럼이
# 늘면 저절로 따라오므로 손으로 고칠 일이 없다.
outputFormats:
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true

outputs:
  home: [HTML, RSS, LLMS]
