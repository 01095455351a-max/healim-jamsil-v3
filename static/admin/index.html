<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 관리 화면은 검색에 잡히면 안 된다. static/_headers 의 X-Robots-Tag 와 짝이다. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>해아림한의원 잠실점 — 글 관리</title>
</head>
<body>
  <!-- Decap CMS. 판을 올릴 때는 아래 번호만 바꾼다.
       배포 파일을 저장소에 두지 않고 CDN에서 받는다 — 4.9MB짜리 파일이라
       저장소가 무거워지고, 판을 올릴 때마다 다시 커밋해야 한다. -->
  <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
</body>
</html>
